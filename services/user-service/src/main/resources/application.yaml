server:
    port: 8000

spring:
    application:
        name: user-service

    jpa:
        hibernate:
            ddl-auto: update

    datasource:
        url: jdbc:mysql://${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver


eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8700/eureka
